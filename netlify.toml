[build]
  publish = "."

# Le générateur du site n'a pas à être publié
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

# Ancienne page d'accueil éventuelle
[[redirects]]
  from = "/plombier-toulouse/"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    # Les pages appellent style.css?v=<empreinte> : chaque modification change l'URL
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
